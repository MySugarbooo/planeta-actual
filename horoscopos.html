<style>

sult p{color:#555d6d;font-size:14px;line-height:1.7}.areas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.area{border-top:2px solid #cdb6df;padding-top:15px}.area b{color:#67399f;font-size:12px;letter-spacing:.09em;text-transform:uppercase}.area p{margin:10px 0}.disclaimer{font-size:12px!important;color:#777!important;margin-top:22px!important}.footer{border-top:1px solid var(--line);color:#777;font-size:12px;margin-top:55px;padding:25px 0} @media(max-width:900px){.signs{grid-template-columns:repeat(3,1fr)}.areas{grid-template-columns:1fr}}@media(max-width:590px){.wrap{padding:0 16px}.top-inner{min-height:75px}.brand{font-size:17px}.actions{gap:8px}.intro{padding-top:45px}.signs{grid-template-columns:repeat(2,1fr);gap:10px}.sign{padding:14px;min-height:135px}.name{font-size:19px}.result{padding:20px}}
</style></head><body>

<script src="./site-i18n.js"></script><script>
const signs=[["aries","♈","Aries","Aries","21 mar – 19 abr","Mar 21 – Apr 19"],["tauro","♉","Tauro","Taurus","20 abr – 20 may","Apr 20 – May 20"],["geminis","♊","Géminis","Gemini","21 may – 20 jun","May 21 – Jun 20"],["cancer","♋","Cáncer","Cancer","21 jun – 22 jul","Jun 21 – Jul 22"],["leo","♌","Leo","Leo","23 jul – 22 ago","Jul 23 – Aug 22"],["virgo","♍","Virgo","Virgo","23 ago – 22 sep","Aug 23 – Sep 22"],["libra","♎","Libra","Libra","23 sep – 22 oct","Sep 23 – Oct 22"],["escorpio","♏","Escorpio","Scorpio","23 oct – 21 nov","Oct 23 – Nov 21"],["sagitario","♐","Sagitario","Sagittarius","22 nov – 21 dic","Nov 22 – Dec 21"],["capricornio","♑","Capricornio","Capricorn","22 dic – 19 ene","Dec 22 – Jan 19"],["acuario","♒","Acuario","Aquarius","20 ene – 18 feb","Jan 20 – Feb 18"],["piscis","♓","Piscis","Pisces","19 feb – 20 mar","Feb 19 – Mar 20"]];
const texts={
es:{kicker:"Astrología · Entretenimiento",headline:"Tu horóscopo de hoy",description:"Una lectura ligera para empezar el día. Elige tu signo y descubre mensajes nuevos cada día.",back:"Volver a noticias",love:"Amor y vínculos",work:"Proyectos",energy:"Bienestar",disclaimer:"Horóscopos generados automáticamente con fines de entretenimiento. No son predicciones fiables ni sustituyen consejos profesionales.",foot:"Contenido recreativo generado automáticamente. No predice acontecimientos ni sustituye asesoría profesional.",day:"Lectura del día",selection:"Tu signo",
loveLines:["Una conversación amable puede acercarte a alguien que aprecias.","Escuchar con atención será más útil que intentar tener la última palabra.","Date espacio para reconocer lo que necesitas de tus relaciones.","Un gesto sencillo puede fortalecer una amistad importante.","La sinceridad con tacto ayuda a evitar malentendidos.","Compartir tiempo de calidad puede ser más valioso que hacer grandes planes.","Hoy conviene respetar el ritmo de las personas que te rodean.","Pon límites claros sin perder la calidez."],

let selected;
try{selected=new URLSearchParams(location.search).get("sign")||localStorage.getItem("pa-sign")||"aries"}catch(e){selected="aries"}if(!signs.some(s=>s[0]===selected))selected="aries";
function dailyKey(){const parts=new Intl.DateTimeFormat("en-US",{timeZone:"America/Mexico_City",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());const get=x=>parts.find(p=>p.type===x).value;return get("year")+"-"+get("month")+"-"+get("day")}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function pick(arr,salt){return arr[hash(dailyKey()+"|"+selected+"|"+salt)%arr.length]}
function render(){const en=PA_I18N.language==="en", t=texts[en?"en":"es"];document.title=en?"Daily horoscopes | Planeta Actual":"Horóscopos diarios | Planeta Actual";document.documentElement.lang=en?"en":"es";PA_I18N.apply();document.getElementById("kicker").textContent=t.kicker;document.getElementById("headline").textContent=t.headline;document.getElementById("description").textContent=t.description;document.getElementById("back-link").textContent=t.back;document.getElementById("back-link").href="./"+(en?"?lang=en":"");document.getElementById("home-link").href="./"+(en?"?lang=en":"");document.getElementById("footnote").textContent=t.foot;document.getElementById("date").textContent=new Intl.DateTimeFormat(en?"en-US":"es-MX",{timeZone:"America/Mexico_City",dateStyle:"full"}).format(new Date());document.getElementById("signs").innerHTML=signs.map(s=>'<button type="button" class="sign '+(selected===s[0]?"active":"")+'" data-sign="'+s[0]+'" aria-pressed="'+(selected===s[0])+'"><span class="symbol" aria-hidden="true">'+s[1]+'</span><span class="name">'+(en?s[3]:s[2])+'</span><span class="range">'+(en?s[5]:s[4])+'</span></button>').join("");const s=signs.find(s=>s[0]===selected);document.getElementById("result").innerHTML='<div class="kicker">'+t.day+'</div><div class="result-head"><span class="symbol">'+s[1]+'</span><h2>'+t.selection+': '+(en?s[3]:s[2])+'</h2></div><div class="areas"><div class="area"><b>'+t.love+'</b><p>'+pick(t.loveLines,"love")+'</p></div><div class="area"><b>'+t.work+'</b><p>'+pick(t.workLines,"work")+'</p></div><div class="area"><b>'+t.energy+'</b><p>'+pick(t.energyLines,"energy")+'</p></div></div><p class="disclaimer">'+t.disclaimer+'</p>';}
document.getElementById("signs").addEventListener("click",e=>{const b=e.target.closest("[data-sign]");if(!b)return;selected=b.dataset.sign;try{localStorage.setItem("pa-sign",selected)}catch(e){}try{let u=new URL(location.href);u.searchParams.set("sign",selected);history.replaceState(null,"",u.pathname+u.search)}catch(e){}render();document.getElementById("result").scrollIntoView({behavior:"smooth",block:"nearest"})});
document.getElementById("pa-language").addEventListener("click",()=>{PA_I18N.change(PA_I18N.language==="en"?"es":"en");render()});
render();let previousDay=dailyKey();setInterval(()=>{if(dailyKey()!==previousDay){previousDay=dailyKey();render()}},60000);
</script></body></html>
