name: Actualizar noticias y publicar Planeta Actual
on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh:
    timeout-minutes: 20
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[auto-news]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: .argos-models
          key: argos-spanish-english-v1
      - run: pip install feedparser==6.0.12 argostranslate
      - run: python update_news.py
      - name: Traducir noticias al inglés
        env:
          ARGOS_PACKAGE_DIR: ${{ github.workspace }}/.argos-models
          OMP_NUM_THREADS: '2'
        run: python translate_news.py
      - name: Guardar noticias
        run: |
          git config user.name 'planeta-actual-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news-data.js
          if [ -f data/translations-cache.json ]; then git add data/translations-cache.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar noticias [auto-news]'
            git push
          fi
  deploy:
    needs: refresh
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
